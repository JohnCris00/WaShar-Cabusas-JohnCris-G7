{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<p><strong>{{ shop.name }}</strong> · {{ shop.address }}<br>
   Open {{ shop.opening_time|time:"g:i A" }} – {{ shop.closing_time|time:"g:i A" }}</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
  <a href="{% url 'reservations:my_reservations' %}">Cancel</a>
</form>
{% endblock %}
