{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}WaShar{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/washar.css' %}">
</head>
<body>
<nav class="nav">
  <a class="brand" href="{% url 'accounts:home' %}">WaShar</a>
  {% if user.is_authenticated %}
    <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
    <a href="{% url 'accounts:profile' %}">Profile</a>
    <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
  {% else %}
    <a href="{% url 'accounts:login' %}">Log in</a>
    <a href="{% url 'accounts:register' %}">Create account</a>
  {% endif %}
</nav>
<main>
  {% for message in messages %}
    <div class="msg {{ message.tags }}" role="status">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
