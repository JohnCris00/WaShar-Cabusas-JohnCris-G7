{% extends "base.html" %}
{% block title %}Log in · WaShar{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}{{ field.errors }}
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p>New to WaShar? <a href="{% url 'accounts:register' %}">Create an account</a></p>
</div>
{% endblock %}
